<html>
    <head>
        <title>SkyPeak Teletext</title>
        <script src="page.js"></script>
    </head>
    <body style="font-family: Segoe UI;">
        <a href="index.html"><img src="img/logo.png" style="width: 100px;"></a>
        <h1>Welcome to SkyPeak Teletext!</h1>
        <img id="pgout" src="p/100.png" alt="The Page you typed in is not inside the website" style="width: 600px;">
        <hr>
        <form id="pgtxt">
            <h2>Page Number (P100-P899)</h2>
            <input type="number" id="pgin" min="100" max="899" style="height:18px; width:50px;" maxlength="3" value="100" required>
            <button type="submit">Go!</button>
        </form>
        <br>
        <h4>Colour Page</h4>
        <a href="#" id="link" page-link="101" style="color: red;">101</a>
        <a href="#" id="link" page-link="201" style="color: green;">201</a>
        <a href="#" id="link" page-link="601" style="color: blue;">601</a>
        <a href="#" id="link" page-link="801" style="color: dark-yellow;">801</a>
        <h6>© 2026 SkyPeak Mediacorp and Skypeak Brodacasting Corporation All Rights Reserved.</h6>

       <script>
        const pgtxt = document.getElementById('pgtxt');
        const input = document.getElementById('pgin');
        const output = document.getElementById('pgout');

        // Handle form submission to update the image
        pgtxt.addEventListener('submit', function(event) {
            event.preventDefault(); 
            let num = parseInt(input.value, 10);
            
            if (num >= 100 && num <= 899) {
                output.src = `p/${num}.png`;
            } else {
                alert('Please enter a number between 100 and 899.');
            }
        });

        // Handle quick links to update the input field value
        document.querySelectorAll('.link').forEach(link => {
            link.addEventListener('click', function(event) {
                event.preventDefault();
                input.value = this.getAttribute('page-link');
            });
        });
       </script>
    </body>
</html>
